# The base URL of the site; the only required configuration variable.
base_url = "https://simeg.github.io"

# The site title and description; used in feeds by default.
title = "dotlog"
description = "Occasional notes on tech, code, and things I’ve learned along the way."

# The default language; used in feeds.
default_language = "en"

# The site theme to use.
theme = "archie-zola"

# For overriding the default output directory `public`, set it to another value
# (e.g.: "docs")
output_dir = "public"

# Whether dotfiles at the root level of the output directory are preserved when
# (re)building the site. Enabling this also prevents the deletion of the output
# folder itself on rebuilds.
preserve_dotfiles_in_output = false

# When set to "true", the Sass files in the `sass` directory in the site root
# are compiled. Sass files in theme directories are always compiled.
compile_sass = true

# When set to "true", the generated HTML files are minified.
minify_html = false

# A list of glob patterns specifying asset files to ignore when the content
# directory is processed. Defaults to none, which means that all asset files
# are copied over to the `public` directory.
ignored_content = []

# Similar to ignored_content, a list of glob patterns specifying asset files to
# ignore when the static directory is processed. Defaults to none, which means
# that all asset files are copied over to the `public` directory
ignored_static = []

# When set to "true", a feed is automatically generated.
generate_feeds = true

# The default author for pages
author = "Simon"

taxonomies = [
    { name = "tags" }
]

# When set to "true", a search index is built from the pages and section
# content for `default_language`.
build_search_index = false

# When set to "false", Sitemap.xml is not generated
generate_sitemap = true

# When set to "false", robots.txt is not generated
generate_robots_txt = true

# Configuration of the Markdown rendering
[markdown]
# When set to "true", all code blocks are highlighted.
highlight_code = true
highlight_theme = "base16-ocean-dark"
render_emoji = true

[extra]
# control dark mode: auto | dark | toggle
mode = "toggle"

# subtitle will show under the title in index page
subtitle = "Occasional notes on tech, code, and things I’ve learned along the way."

# if set true, will use external CDN resource to load font and js file
useCDN = false

favicon = "/icon/favicon.png"

# show in the footer
copyright = "simon"

# config your Google Analysis ID
ga = "G-55BSWDE35Y"

# Custom CSS files to include in <head>
custom_css = [
    "css/custom.css",
    "css/custom-dark.css"
]

# Custom JS files to include in <head>
# custom_js = [
#     "js/themetoggle.js"
# ]

# config multi-language menu and other text
[[extra.translations.en]]
show_more = "Read more ⟶"
previous_page = "← Previous"
next_page = "Next →"
posted_on = "on "
posted_by = "Published by"
read_time = "minute read"
all_tags = "All tags"
menus = [
    { name = "Home", url = "/", weight = 1 },
    { name = "Tags", url = "/tags", weight = 2 },
    { name = "About", url = "/about", weight = 3 },
]

# config social icon info in the footer
[[extra.social]]
icon = "github"
name = "GitHub"
url = "https://github.com/simeg"
